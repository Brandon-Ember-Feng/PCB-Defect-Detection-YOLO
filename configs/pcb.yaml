# ============================================================
# YOLOv8 训练配置（与数据集内 data.yaml 内容一致的仓库副本/模板）
# 实际训练时两者用其一即可；把数据集放到本项目根目录后即可直接训练。
# 注意：names 顺序即类别ID，必须与标注、模型model.names、单片机NAME表一致
# ============================================================
# 数据集根目录（相对路径，换电脑只需改这里）
path: ./pcb-defect-dataset
train: train        # 训练集（YOLO自动在其下找 images/ 与 labels/）
val: val            # 验证集

# 6类PCB缺陷
names:
  0: mouse_bite        # 鼠咬   -> LCD: MBITE
  1: spur              # 毛刺   -> LCD: SPUR
  2: missing_hole      # 缺孔   -> LCD: MHOLE
  3: short             # 短路   -> LCD: SHORT
  4: open_circuit      # 开路   -> LCD: OPEN
  5: spurious_copper   # 多余铜 -> LCD: SCOP
